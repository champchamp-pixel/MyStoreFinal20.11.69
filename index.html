<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="หน้าแรกของระบบร้านยาจำลอง สำหรับเจ้าหน้าที่เข้าถึงหน้าขายยา จัดการระบบ Dashboard คลังยา และตรวจสถานะระบบ">
  <title>ระบบร้านยาจำลอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --card: #181818;
      --card-hover: #222222;
      --card-active: #282828;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #b3b3b3;
      --accent: #1ed760;
      --accent-soft: rgba(30, 215, 96, 0.14);
      --accent-border: rgba(30, 215, 96, 0.45);
      --warn-bg: rgba(255, 193, 7, 0.1);
      --warn-border: rgba(255, 193, 7, 0.35);
      --warn-text: #ffd666;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 400 16px/1.6 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
    }

    main {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 48px) 16px 36px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 8px;
    }

    h1 {
      margin: 4px 0 0;
      font-size: clamp(28px, 6vw, 36px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .notice {
      margin: 0;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .menu-link {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 80px;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
    }

    .menu-link:hover {
      background: var(--card-hover);
      border-color: var(--accent-border);
    }

    .menu-link:active {
      background: var(--card-active);
      transform: scale(0.99);
    }

    .menu-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-color: var(--accent);
    }

    .menu-index {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      display: grid;
      place-items: center;
      flex: 0 0 40px;
      font-variant-numeric: tabular-nums;
    }

    .menu-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-title {
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
    }

    .menu-desc {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .menu-arrow {
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      font-weight: 600;
      padding-left: 4px;
      transition: color 0.16s ease, transform 0.16s ease;
    }

    .menu-link:hover .menu-arrow,
    .menu-link:focus-visible .menu-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .system-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }

    .system-strip-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666666;
      flex: 0 0 8px;
    }

    .system-strip.is-ok .status-dot {
      background: var(--accent);
    }

    .system-strip.is-ok .system-strip-text {
      color: var(--text);
    }

    .system-strip-meta {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    footer {
      margin-top: auto;
      padding-top: 8px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (min-width: 640px) {
      .menu-link {
        min-height: 84px;
        padding: 18px 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .menu-link,
      .menu-arrow {
        transition: none;
      }
      .menu-link:active,
      .menu-link:hover .menu-arrow,
      .menu-link:focus-visible .menu-arrow {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Workshop ร้านยาจำลอง</div>
      <h1>ระบบจัดการร้านยาจำลอง</h1>
      <p class="subtitle">เลือกหน้างานที่ต้องการใช้งานสำหรับเจ้าหน้าที่ร้านยา</p>
    </header>

    <p class="notice" role="note">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ห้ามใส่ชื่อผู้ป่วยจริง</p>

    <nav aria-label="เมนูหลักระบบร้านยาจำลอง">
      <ul class="menu-list" id="menu-list"></ul>
    </nav>

    <div class="system-strip" id="system-strip" role="status" aria-live="polite">
      <span class="system-strip-main">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="system-strip-text" id="system-status">กำลังตรวจการเชื่อมต่อฐานข้อมูล…</span>
      </span>
      <span class="system-strip-meta" id="system-meta"></span>
    </div>

    <noscript>
      <p class="notice">กรุณาเปิด JavaScript เพื่อแสดงรายการเมนูหลักของระบบ</p>
    </noscript>

    <footer>Workshop ระบบร้านยาจำลอง · เชื่อมต่อ Supabase ผ่าน Vercel API</footer>
  </main>

  <script>
    // เพิ่มหรือลบปุ่มหน้างานได้ด้วยการแก้หนึ่งบรรทัดในอาร์เรย์นี้
    const LINKS = [
      { href: 'pos.html', title: 'หน้าขายยา', desc: 'เลือกยา กรอกจำนวน บันทึกการจ่ายยา' },
      { href: 'admin.html', title: 'จัดการระบบ (ผู้ดูแล)', desc: 'บัญชียา คลังรายล็อต รายการจ่าย ต้องใช้รหัสผู้ดูแล' },
      { href: 'dashboard.html', title: 'Dashboard คลังยา', desc: 'ภาพรวมคลัง ล็อตใกล้หมดอายุ ยาต่ำกว่าจุดสั่งซื้อ' },
      { href: 'status.html', title: 'ตรวจสถานะระบบ', desc: 'ตรวจว่าการเชื่อมต่อแต่ละส่วนทำงานปกติ' },
    ];

    function buildMenu(items) {
      const list = document.getElementById('menu-list');
      const fragment = document.createDocumentFragment();

      items.forEach((item, index) => {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.className = 'menu-link';
        link.setAttribute('href', item.href);

        const badge = document.createElement('span');
        badge.className = 'menu-index';
        badge.setAttribute('aria-hidden', 'true');
        badge.textContent = String(index + 1).padStart(2, '0');

        const body = document.createElement('span');
        body.className = 'menu-body';

        const title = document.createElement('span');
        title.className = 'menu-title';
        title.textContent = item.title;

        const desc = document.createElement('span');
        desc.className = 'menu-desc';
        desc.textContent = item.desc;

        const arrow = document.createElement('span');
        arrow.className = 'menu-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '›';

        body.append(title, desc);
        link.append(badge, body, arrow);
        li.append(link);
        fragment.append(li);
      });

      list.replaceChildren(fragment);
    }

    async function checkSystemSummary() {
      const strip = document.getElementById('system-strip');
      const statusEl = document.getElementById('system-status');
      const metaEl = document.getElementById('system-meta');

      if (location.protocol === 'file:') {
        statusEl.textContent = 'เปิดจากไฟล์ในเครื่อง (เปิดบนลิงก์ Vercel เพื่อเชื่อมฐานข้อมูล)';
        return;
      }

      try {
        const response = await fetch('/api/data', { cache: 'no-store' });
        const text = await response.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}

        if (response.ok && data && data.drugs && data.stock && data.dispense_log) {
          const asOf = (data.drugs.meta && data.drugs.meta.as_of) || '-';
          const num = new Intl.NumberFormat('th-TH');
          strip.classList.add('is-ok');
          statusEl.textContent = 'เชื่อมต่อ Supabase แล้ว';
          metaEl.textContent = `วันอ้างอิง ${asOf} · ยา ${num.format(data.drugs.items.length)} · ล็อต ${num.format(data.stock.items.length)}`;
        } else {
          statusEl.textContent = 'ยังเชื่อมต่อฐานข้อมูลไม่ได้ — กด "ตรวจสถานะระบบ" เพื่อดูรายละเอียด';
        }
      } catch {
        statusEl.textContent = 'ยังเชื่อมต่อฐานข้อมูลไม่ได้ — กด "ตรวจสถานะระบบ" เพื่อดูรายละเอียด';
      }
    }

    buildMenu(LINKS);
    checkSystemSummary();
  </script>
</body>
</html>
